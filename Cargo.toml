[package]
name = "keyring_map"
version = "0.1.2"
edition = "2024"
description = "A hash map with multiple keys per value using a ring structure to minimize allocations."
readme = "README.md"
license  = "MIT OR Apache-2.0"
repository = "https://github.com/StefanMathis/keyring_map.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slab = {version = "0.4"}
indexmap = {version = "2.0"}
serde = { version = "1", optional = true }
rayon = { version = "1.5", optional = true }
embed-doc-image = { version = "0.1.4", optional = true }

[features]
default = []
serde = ["dep:serde"]
rayon = ["dep:rayon", "indexmap/rayon"]
doc-images = ["dep:embed-doc-image"]

[dev-dependencies]
indoc = "1.0"
yaml_serde = "0.10.6"
keyring_map = { path = ".", features = ["serde", "rayon"] }

# Benchmarking
criterion = "0.5.1"
multi_key_map = "0.3.0"
multi-map = "1.3.0"

[[bench]]
name = "insertion"
harness = false

[[bench]]
name = "access"
harness = false

[[bench]]
name = "removal"
harness = false

[[bench]]
name = "iteration"
harness = false

[package.metadata.docs.rs]
features = ["serde", "rayon", "doc-images"]
rustdoc-args = ["--cfg", "docsrs"]